daikin_ac_power_on:
  alias: Daikin AC - Power On
  sequence:
  - action: remote.send_command
    target:
      entity_id: remote.lrur
    data:
      device: daikin_ac
      command: power_on
      delay_secs: 0.4
      num_repeats: 2
  mode: single
daikin_ac_power_off:
  alias: Daikin AC - Power Off
  sequence:
