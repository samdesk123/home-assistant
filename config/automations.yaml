- id: '1793316572831'
  alias: n8n Offline Alert
  description: Alert when n8n is offline for 2 minutes
  triggers:
  - trigger: state
    entity_id: binary_sensor.n8n_health
    to: 'off'
    for:
      minutes: 2
  actions:
  - action: persistent_notification.create
    data:
      title: n8n Server Offline
      message: n8n has been unreachable for 2 minutes.
  mode: single
- id: '1793442274862'
  alias: Auto Reload Tapo Camera Every 2 Minutes
  description: 'Reload the TP-Link Smart Home integration every 2 minutes to recover
    camera controls.

    '
  triggers:
  - trigger: time_pattern
    minutes: /2
  conditions: []
  actions:
  - action: homeassistant.reload_config_entry
    data:
      entity_id: button.loung_room_pan_left
  mode: single
- id: '1793769293878'
  alias: Turn on LR Lamp
  description: ''
  triggers:
  - trigger: time
    at: '19:30:00'
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
  conditions: []
  actions:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.genio_smart_wifi_bulb_a60_rgb_cct
    data:
      brightness_pct: 12
  mode: single
- id: '1793769342226'
  alias: Turn off LR LAMP
  description: ''
  triggers:
  - trigger: time
    at: '23:00:00'
    weekday:
    - tue
    - wed
    - thu
    - mon
    - fri
    - sat
    - sun
  conditions: []
  actions:
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.genio_smart_wifi_bulb_a60_rgb_cct
    data: {}
  mode: single
- id: '1794971876775'
  alias: Turn On AC
  description: Turn on Daikin AC when room temperature exceeds 19°C
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.lrur_temperature
    above: 24
  conditions: []
  actions:
  - action: script.turn_on
    target:
      entity_id: script.daikin_ac_power_on
    data: {}
  mode: single
- id: '1794972442737'
  alias: Turn Off AC
  description: Turn off Daikin AC when room temperature exceeds 24°C
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.lrur_temperature
    below: 24
  conditions: []
  actions:
  - action: script.turn_on
    target:
      entity_id: script.daikin_ac_power_off
  mode: single
